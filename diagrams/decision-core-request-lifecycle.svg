<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 340" width="1100" height="340" role="img"
     aria-labelledby="reqTitle reqDesc">
  <title id="reqTitle">The life of one System One request</title>
  <desc id="reqDesc">DECISION_PROVIDER is looked up in the registry, the endpoint is resolved, and its scope is
  classified before credentials are checked — which is what lets a key be mandatory only when the endpoint is
  off-host. A remote endpoint needs egress consent; declared requirements are then enforced; the request is sent
  with retries on rate limiting; and the answer is routed through the provider's own confidence gate to an
  action. Each guard reports and stops; none of them discards the evidence already captured.</desc>

  <style>
    /* Tokens mirror src/report/report-assets.ts. Duplicated per file on purpose:
       an SVG embedded with &lt;img&gt; cannot load an external stylesheet. */
    svg {
      --bg: #f4f6fb; --surface: #fff; --surface-2: #f8f9fc;
      --ink: #172033; --muted: #68748a; --line: #e2e6ef;
      --accent: #5a4df0; --accent-2: #2f80ed; --success: #17a673; --warn: #e2a93b; --danger: #ef5b5b;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    @media (prefers-color-scheme: dark) {
      svg {
        --bg: #111522; --surface: #181e2e; --surface-2: #202739;
        --ink: #edf1fb; --muted: #a6afc1; --line: #30394d;
        --accent: #8b81f5; --accent-2: #5aa2f5; --success: #35c894; --warn: #eec368; --danger: #f47c7c;
      }
    }

    .canvas { fill: var(--bg); }
    .card { fill: var(--surface); stroke: var(--line); stroke-width: 1.25; }
    .guard { fill: var(--surface); stroke: var(--warn); stroke-width: 1.25; }
    .title { fill: var(--ink); font-size: 12.5px; font-weight: 600; }
    .sub { fill: var(--muted); font-size: 10px; }
    .cap { fill: var(--muted); font-size: 10.5px; }
    .accent-text { fill: var(--accent); font-size: 10.5px; font-weight: 600; }
    .warn-text { fill: var(--warn); font-size: 10px; font-weight: 600; }
    .ok-text { fill: var(--success); font-size: 10px; font-weight: 600; }
    .wire { fill: none; stroke: var(--line); stroke-width: 1.5; }
    .flow { fill: none; stroke: var(--accent); stroke-width: 1.75; stroke-linecap: round; stroke-dasharray: 5 9; }
    .refuse { fill: none; stroke: var(--warn); stroke-width: 1.4; stroke-dasharray: 3 5; }
    .arrow { fill: var(--accent); }
    .arrow-warn { fill: var(--warn); }
    .chip { fill: var(--surface-2); stroke: var(--line); stroke-width: 1; }
    .num { fill: var(--accent); }
    .num-text { fill: #fff; font-size: 9.5px; font-weight: 700; }
    /* The travelling request: one dot that walks the happy path, so the order is
       legible without reading the labels. */
    .packet { fill: var(--accent); r: 5; }

    @keyframes rise-in { from { opacity: 0; transform: translateY(9px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes dash-flow { to { stroke-dashoffset: -28; } }
    @keyframes travel {
      0%   { transform: translate(0, 0);     opacity: 0; }
      6%   { opacity: 1; }
      22%  { transform: translate(176px, 0); }
      44%  { transform: translate(370px, 0); }
      66%  { transform: translate(564px, 0); }
      86%  { transform: translate(760px, 0); }
      96%  { transform: translate(944px, 0); opacity: 1; }
      100% { transform: translate(944px, 0); opacity: 0; }
    }
    @keyframes blink { 0%, 100% { opacity: .35; } 50% { opacity: 1; } }

    .stage { animation: rise-in .5s cubic-bezier(.22, .68, .24, 1) both; }
    .s1 { animation-delay: .04s; } .s2 { animation-delay: .15s; } .s3 { animation-delay: .26s; }
    .s4 { animation-delay: .37s; } .s5 { animation-delay: .48s; } .s6 { animation-delay: .59s; }
    .flow { animation: dash-flow 1.1s linear infinite; }
    .refuse { animation: dash-flow 2.2s linear infinite; }
    .packet { animation: travel 6.5s cubic-bezier(.5, .05, .5, .95) infinite; }
    .blink { animation: blink 2.4s ease-in-out infinite; }

    @media (prefers-reduced-motion: reduce) {
      .stage, .flow, .refuse, .packet, .blink { animation: none; }
      .stage { opacity: 1; transform: none; }
      .packet { opacity: 0; }
      .blink { opacity: 1; }
    }
  </style>

  <rect class="canvas" width="1100" height="340" rx="18"/>

  <text class="accent-text" x="36" y="40">POST /v1/systemone · resolution order is the design, not an accident</text>

  <!-- 1 provider id -->
  <g class="stage s1">
    <rect class="card" x="36" y="60" width="152" height="72" rx="11"/>
    <circle class="num" cx="52" cy="78" r="8"/><text class="num-text" x="49" y="81">1</text>
    <text class="title" x="68" y="82">provider id</text>
    <text class="sub" x="52" y="103">DECISION_PROVIDER</text>
    <text class="sub" x="52" y="119">registry lookup</text>
  </g>
  <path class="wire" d="M188 96 H228"/><path class="flow" d="M188 96 H228"/>
  <polygon class="arrow" points="228,96 221,92 221,100"/>

  <!-- 2 endpoint -->
  <g class="stage s2">
    <rect class="card" x="236" y="60" width="152" height="72" rx="11"/>
    <circle class="num" cx="252" cy="78" r="8"/><text class="num-text" x="249" y="81">2</text>
    <text class="title" x="268" y="82">endpoint</text>
    <text class="sub" x="252" y="103">resolveEndpoint(env)</text>
    <text class="sub" x="252" y="119">then classify its scope</text>
  </g>
  <path class="wire" d="M388 96 H428"/><path class="flow" d="M388 96 H428"/>
  <polygon class="arrow" points="428,96 421,92 421,100"/>

  <!-- 3 egress consent -->
  <g class="stage s3">
    <rect class="guard" x="436" y="60" width="164" height="72" rx="11"/>
    <circle class="num" cx="452" cy="78" r="8"/><text class="num-text" x="449" y="81">3</text>
    <text class="title" x="468" y="82">egress consent</text>
    <text class="ok-text" x="452" y="103">local → no consent needed</text>
    <text class="warn-text" x="452" y="119">remote → must be granted</text>
  </g>
  <path class="wire" d="M600 96 H640"/><path class="flow" d="M600 96 H640"/>
  <polygon class="arrow" points="640,96 633,92 633,100"/>

  <!-- 4 requirements -->
  <g class="stage s4">
    <rect class="guard" x="648" y="60" width="164" height="72" rx="11"/>
    <circle class="num" cx="664" cy="78" r="8"/><text class="num-text" x="661" y="81">4</text>
    <text class="title" x="680" y="82">requirements</text>
    <text class="sub" x="664" y="103">required · optional</text>
    <text class="warn-text" x="664" y="119">required-when-remote</text>
  </g>
  <path class="wire" d="M812 96 H852"/><path class="flow" d="M812 96 H852"/>
  <polygon class="arrow" points="852,96 845,92 845,100"/>

  <!-- 5 send -->
  <g class="stage s5">
    <rect class="card" x="860" y="60" width="204" height="72" rx="11"/>
    <circle class="num" cx="876" cy="78" r="8"/><text class="num-text" x="873" y="81">5</text>
    <text class="title" x="892" y="82">send, with retries</text>
    <rect class="chip" x="876" y="94" width="56" height="20" rx="5"/>
    <text class="sub" x="884" y="108">429</text>
    <rect class="chip" x="938" y="94" width="56" height="20" rx="5"/>
    <text class="sub" x="946" y="108">503</text>
    <rect class="chip" x="1000" y="94" width="50" height="20" rx="5"/>
    <text class="sub" x="1008" y="108">529</text>
    <text class="sub" x="876" y="126">Bearer token when resolved</text>
  </g>

  <!-- the travelling request -->
  <circle class="packet" cx="112" cy="146" r="5"/>

  <!-- guard exits -->
  <g class="stage s6">
    <path class="refuse" d="M518 132 V176"/>
    <polygon class="arrow-warn" points="518,176 514,169 522,169"/>
    <rect class="card" x="424" y="182" width="188" height="34" rx="9"/>
    <text class="warn-text" x="438" y="203">EgressConsentError</text>
    <path class="refuse" d="M730 132 V176"/>
    <polygon class="arrow-warn" points="730,176 726,169 734,169"/>
    <rect class="card" x="636" y="182" width="200" height="34" rx="9"/>
    <text class="warn-text" x="650" y="203">ProviderConfigurationError</text>
    <text class="cap" x="424" y="236">every guard reports and stops — your evidence is already captured and is never discarded</text>
  </g>

  <!-- the gate, as the answer's destination -->
  <g class="stage s6">
    <path class="wire" d="M962 132 V262 H300"/>
    <path class="flow" d="M962 132 V262 H300"/>
    <polygon class="arrow" points="300,262 307,258 307,266"/>
    <rect class="card" x="36" y="240" width="256" height="76" rx="11"/>
    <text class="title" x="54" y="264">the answer, then the gate</text>
    <text class="sub" x="54" y="282">confidence, or winning probability mass</text>
    <rect class="chip blink" x="54" y="290" width="66" height="20" rx="5"/>
    <text class="sub" x="62" y="304">auto_file</text>
    <rect class="chip" x="126" y="290" width="92" height="20" rx="5"/>
    <text class="sub" x="134" y="304">flag_for_review</text>
    <rect class="chip" x="224" y="290" width="58" height="20" rx="5"/>
    <text class="sub" x="232" y="304">escalate</text>
  </g>
  <text class="cap" x="640" y="278">which field gates is declared by the provider, never assumed</text>
</svg>
