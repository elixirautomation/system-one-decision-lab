<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 360" width="1060" height="360" role="img"
     aria-labelledby="ucTitle ucDesc">
  <title id="ucTitle">The anatomy of a use case</title>
  <desc id="ucDesc">A use case owns five things and borrows two. It owns its evidence tables, the questions it
  asks in its own domain vocabulary, its deterministic baseline, its report, and its commands. It borrows the
  provider contract and the shared decisions table from infra. Nothing about it is visible to another use case,
  and nothing about it is visible to infra.</desc>

  <style>
    /* Tokens mirror src/report/report-assets.ts. Duplicated per file on purpose:
       an SVG embedded with &lt;img&gt; cannot load an external stylesheet. */
    svg {
      --bg: #f4f6fb; --surface: #fff; --surface-2: #f8f9fc;
      --ink: #172033; --muted: #68748a; --line: #e2e6ef;
      --accent: #5a4df0; --accent-2: #2f80ed; --success: #17a673;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    @media (prefers-color-scheme: dark) {
      svg {
        --bg: #111522; --surface: #181e2e; --surface-2: #202739;
        --ink: #edf1fb; --muted: #a6afc1; --line: #30394d;
        --accent: #8b81f5; --accent-2: #5aa2f5; --success: #35c894;
      }
    }

    .canvas { fill: var(--bg); }
    .card { fill: var(--surface); stroke: var(--line); stroke-width: 1.25; }
    .card-alt { fill: var(--surface-2); stroke: var(--line); stroke-width: 1.25; }
    .owned { fill: var(--surface); stroke: var(--success); stroke-width: 1.3; }
    .borrowed { fill: var(--surface); stroke: var(--accent); stroke-width: 1.3; stroke-dasharray: 5 4; }
    .group { fill: none; stroke: var(--line); stroke-width: 1.25; stroke-dasharray: 3 4; }
    .title { fill: var(--ink); font-size: 12.5px; font-weight: 600; }
    .sub { fill: var(--muted); font-size: 10px; }
    .cap { fill: var(--muted); font-size: 10.5px; }
    .accent-text { fill: var(--accent); font-size: 10.5px; font-weight: 600; }
    .ok-text { fill: var(--success); font-size: 10.5px; font-weight: 600; }
    .wire { fill: none; stroke: var(--line); stroke-width: 1.5; }
    .flow { fill: none; stroke: var(--accent); stroke-width: 1.6; stroke-linecap: round; stroke-dasharray: 5 9; }
    .arrow { fill: var(--accent); }
    .chip { fill: var(--surface-2); stroke: var(--line); stroke-width: 1; }
    .glow { fill: none; stroke: var(--success); stroke-width: 2; opacity: 0; }

    @keyframes rise-in { from { opacity: 0; transform: translateY(9px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes dash-flow { to { stroke-dashoffset: -28; } }
    @keyframes walk { 0%, 10% { opacity: 0; } 3% { opacity: .9; } 20%, 100% { opacity: 0; } }

    .stage { animation: rise-in .5s cubic-bezier(.22, .68, .24, 1) both; }
    .s1 { animation-delay: .05s; } .s2 { animation-delay: .16s; } .s3 { animation-delay: .27s; }
    .s4 { animation-delay: .38s; } .s5 { animation-delay: .49s; } .s6 { animation-delay: .60s; }
    .flow { animation: dash-flow 1.2s linear infinite; }
    /* The highlight walks the five owned pieces, which is the checklist for a new
       use case. */
    .glow { animation: walk 7.5s linear infinite; }
    .g1 { animation-delay: .7s; } .g2 { animation-delay: 2.2s; } .g3 { animation-delay: 3.7s; }
    .g4 { animation-delay: 5.2s; } .g5 { animation-delay: 6.7s; }

    @media (prefers-reduced-motion: reduce) {
      .stage, .flow, .glow { animation: none; }
      .stage { opacity: 1; transform: none; }
      .glow { opacity: 0; }
    }
  </style>

  <rect class="canvas" width="1060" height="360" rx="18"/>

  <text class="ok-text" x="36" y="40">what a use case owns — the checklist for adding one</text>

  <g class="stage s1">
    <rect class="owned" x="36" y="54" width="186" height="80" rx="11"/>
    <text class="title" x="54" y="78">1 · its evidence</text>
    <text class="sub" x="54" y="96">src/db/schema.ts</text>
    <text class="sub" x="54" y="111">its own drizzle/ + journal</text>
    <text class="cap" x="54" y="126">no other package sees it</text>
  </g>

  <g class="stage s2">
    <rect class="owned" x="238" y="54" width="186" height="80" rx="11"/>
    <text class="title" x="256" y="78">2 · its questions</text>
    <text class="sub" x="256" y="96">the taxonomy, in your</text>
    <text class="sub" x="256" y="111">own domain vocabulary</text>
    <text class="cap" x="256" y="126">choice · score · noul</text>
  </g>

  <g class="stage s3">
    <rect class="owned" x="440" y="54" width="186" height="80" rx="11"/>
    <text class="title" x="458" y="78">3 · its baseline</text>
    <text class="sub" x="458" y="96">deterministic, code-owned</text>
    <text class="sub" x="458" y="111">counts and invariants</text>
    <text class="cap" x="458" y="126">measures the engine</text>
  </g>

  <g class="stage s4">
    <rect class="owned" x="642" y="54" width="186" height="80" rx="11"/>
    <text class="title" x="660" y="78">4 · its report</text>
    <text class="sub" x="660" y="96">one offline HTML file</text>
    <text class="sub" x="660" y="111">inside the package</text>
    <text class="cap" x="660" y="126">its only dashboard</text>
  </g>

  <g class="stage s5">
    <rect class="owned" x="844" y="54" width="180" height="80" rx="11"/>
    <text class="title" x="862" y="78">5 · its commands</text>
    <text class="sub" x="862" y="96">package.json scripts</text>
    <text class="sub" x="862" y="111">plus a root alias</text>
    <text class="cap" x="862" y="126">never orchestrator flags</text>
  </g>

  <!-- what it borrows -->
  <path class="wire" d="M300 134 V186"/>
  <path class="flow" d="M300 134 V186"/>
  <polygon class="arrow" points="300,186 296,179 304,179"/>
  <path class="wire" d="M760 134 V186"/>
  <path class="flow" d="M760 134 V186"/>
  <polygon class="arrow" points="760,186 756,179 764,179"/>

  <g class="stage s6">
    <text class="accent-text" x="36" y="182">what it borrows from infra — never copies</text>
    <rect class="borrowed" x="180" y="192" width="240" height="66" rx="11"/>
    <text class="title" x="198" y="216">@sysone/decision-core</text>
    <text class="sub" x="198" y="234">ask a bounded question</text>
    <text class="sub" x="198" y="249">route it through the gate</text>

    <rect class="borrowed" x="640" y="192" width="240" height="66" rx="11"/>
    <text class="title" x="658" y="216">@sysone/decision-store</text>
    <text class="sub" x="658" y="234">recordDecision, one table</text>
    <text class="sub" x="658" y="249">explicit DB URL, migrations</text>
  </g>

  <!-- isolation, stated -->
  <g class="stage s6">
    <rect class="group" x="36" y="278" width="988" height="58" rx="12"/>
    <text class="ok-text" x="56" y="302">isolated by construction</text>
    <text class="sub" x="56" y="322">a use case never imports another use case · infra never imports any of them</text>
    <rect class="chip" x="560" y="290" width="200" height="34" rx="8"/>
    <text class="sub" x="574" y="311">its own check runs alone</text>
    <rect class="chip" x="776" y="290" width="230" height="34" rx="8"/>
    <text class="sub" x="790" y="311">your tests never run another's suite</text>
  </g>

  <g>
    <rect class="glow g1" x="36" y="54" width="186" height="80" rx="11"/>
    <rect class="glow g2" x="238" y="54" width="186" height="80" rx="11"/>
    <rect class="glow g3" x="440" y="54" width="186" height="80" rx="11"/>
    <rect class="glow g4" x="642" y="54" width="186" height="80" rx="11"/>
    <rect class="glow g5" x="844" y="54" width="180" height="80" rx="11"/>
  </g>
</svg>
