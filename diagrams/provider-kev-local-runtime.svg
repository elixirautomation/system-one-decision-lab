<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 286" width="900" height="286" role="img" aria-labelledby="title desc">
  <title id="title">Kev is built from pinned source and gated on its own probabilities</title>
  <desc id="desc">Root composition builds the Kev image from a pinned upstream commit, because Kev is not published to PyPI. The first start downloads the checkpoint named by KEV_RUN into a cached volume; later starts only load it. Because the resolved endpoint stays on this host, no egress consent is required. Kev's choice confidence is a rescaling of the winning option's probability, so the gate reads that probability directly.</desc>
  <style>
    svg{--bg:#f4f6fb;--surface:#fff;--ink:#172033;--muted:#68748a;--line:#e2e6ef;--accent:#5a4df0;--success:#17a673;--warn:#c2410c;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    @media(prefers-color-scheme:dark){svg{--bg:#111522;--surface:#181e2e;--ink:#edf1fb;--muted:#a6afc1;--line:#30394d;--accent:#8b81f5;--success:#35c894;--warn:#fb923c}}
    .bg{fill:var(--bg)}.card{fill:var(--surface);stroke:var(--line);stroke-width:1.5}.title{fill:var(--ink);font-size:15px;font-weight:650}.sub{fill:var(--muted);font-size:11px}.cap{fill:var(--accent);font-size:11px;font-weight:650}.warnt{fill:var(--warn);font-size:11px;font-weight:650}.wire{fill:none;stroke:var(--accent);stroke-width:2;stroke-linecap:round;stroke-dasharray:6 8}.arrow{fill:var(--accent)}.ok{fill:var(--success)}.slow{fill:var(--warn)}
    @keyframes rise-in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}@keyframes dash-flow{to{stroke-dashoffset:-28}}@keyframes breathe{50%{opacity:.55}}
    .stage{animation:rise-in .5s ease both}.s2{animation-delay:.15s}.s3{animation-delay:.3s}.wire{animation:dash-flow 1.2s linear infinite}.ok,.slow{animation:breathe 2s ease-in-out infinite}
    @media(prefers-reduced-motion:reduce){.stage,.wire,.ok,.slow{animation:none}.stage{opacity:1;transform:none}}
  </style>
  <rect class="bg" width="900" height="286" rx="18"/>
  <text class="cap" x="36" y="35">self-hosted: built from pinned source, checkpoint cached once, evidence never leaves</text>
  <g class="stage">
    <rect class="card" x="36" y="62" width="206" height="136" rx="12"/>
    <text class="title" x="56" y="92">Root composition</text>
    <text class="sub" x="56" y="116">compose profile: kev</text>
    <text class="sub" x="56" y="136">image built from a pinned</text>
    <text class="sub" x="56" y="154">upstream commit, not PyPI</text>
    <text class="sub" x="56" y="182">./start brings it up</text>
  </g>
  <path class="wire" d="M242 130 H301"/><polygon class="arrow" points="301,130 292,125 292,135"/>
  <g class="stage s2">
    <rect class="card" x="309" y="62" width="236" height="136" rx="12"/>
    <text class="title" x="329" y="92">Model cache volume</text>
    <circle class="slow" cx="334" cy="116" r="4"/><text class="sub" x="348" y="120">first start: about 3 min</text>
    <text class="sub" x="348" y="138">fetch KEV_RUN (default 0.8B)</text>
    <circle class="ok" cx="334" cy="162" r="4"/><text class="sub" x="348" y="166">later starts: load only</text>
    <text class="sub" x="329" y="190">clean keeps it, purge-models drops it</text>
  </g>
  <path class="wire" d="M545 130 H604"/><polygon class="arrow" points="604,130 595,125 595,135"/>
  <g class="stage s3">
    <rect class="card" x="612" y="62" width="252" height="136" rx="12"/>
    <text class="title" x="632" y="92">On-host endpoint</text>
    <circle class="ok" cx="637" cy="116" r="4"/><text class="sub" x="651" y="120">local scope: no consent needed</text>
    <text class="sub" x="632" y="146">confidence rescales p_max, so</text>
    <text class="sub" x="632" y="164">the gate reads probability mass</text>
    <text class="sub" x="632" y="190">act 0.75 · review 0.45</text>
  </g>
  <text class="warnt" x="36" y="248">Not measured on our data. The CPU default is the smallest checkpoint; upstream puts it well below Kev-4B</text>
  <text class="sub" x="36" y="266">and hosted Jev on sources it never trained on. Thresholds are declared defaults, not tuned against labels.</text>
</svg>
