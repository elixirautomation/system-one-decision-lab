# Runs the same gate a contributor runs locally: typecheck, lint, and every
# package's unit tests (`yarn check`), plus the dependency audit.
#
# No database, Docker, browser, or engine is needed: the unit tests cover
# unreachable-infrastructure paths without them, and no secret is read.
name: check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Actions are pinned to the commit behind their release tag.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      # Yarn Berry comes from the committed .yarn/releases binary (yarnPath);
      # corepack only provides a `yarn` shim that delegates to it.
      - run: corepack enable

      - run: yarn install --immutable

      - run: yarn check

      - run: yarn npm audit
