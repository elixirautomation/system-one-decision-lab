# Yarn Berry, pinned via the committed release in .yarn/releases so every machine
# and CI runner uses the same resolver without a global install.
#
# Deliberately NOT configured here: any private registry override or auth token.
# This lab installs only public packages from the public npm registry.
yarnPath: .yarn/releases/yarn-4.12.0.cjs

# node_modules rather than Plug'n'Play: Playwright and drizzle-kit both resolve
# binaries and worker entry points from a real node_modules tree.
nodeLinker: node-modules

enableTelemetry: false
